[package]
name = "lumine"
version = "0.1.0"
description = "Lumine - a local-first AI companion, by Abdur Rahman Toha"
authors = ["Abdur Rahman Toha"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The native folder picker for the Music settings screen. Added because there is
# no other way to get a real filesystem path out of a desktop file dialog: an
# `<input webkitdirectory>` hands the webview relative paths, which the worker --
# a different process -- cannot use. No capability is granted to the frontend;
# `media.rs` calls it from Rust and exposes an ordinary command.
tauri-plugin-dialog = "2"
# System notifications for approval questions, so an approval reaches a person
# who is looking somewhere else. The buttons are the reason: an action type is
# registered and its Allow / Not now press comes back on the plugin's `action`
# event with the request id in `extra`, which is the same `approve` / `deny`
# answer the in-app card sends -- the worker cannot tell them apart, and does not
# need to.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Credential storage for the AI Control Center. Default features select
# Windows Credential Manager, macOS Keychain, and Linux Secret Service.
keyring = "4"

