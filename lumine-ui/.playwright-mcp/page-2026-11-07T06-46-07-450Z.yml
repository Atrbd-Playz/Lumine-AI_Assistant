                - /url: /docs/react/faq#mode-cannot-select-year-month
            - heading "Why does the date picker switch to the date panel after selecting the year instead of the month panel?" [level=3] [ref=e4339]:
              - link [aria-hidden] [ref=e4340] [cursor=pointer]:
                - /url: "#faq-year-to-date-panel"
              - text: Why does the date picker switch to the date panel after selecting the year instead of the month panel?
            - paragraph [ref=e4341]: After selecting the year, the system directly switches to the date panel instead of month panel. This design is intended to reduce the user's operational burden by allowing them to complete the year modification with just one click, without having to enter the month selection interface again. At the same time, it also avoids additional cognitive burden of remembering the month.
            - heading "How to use DatePicker with customize date library like Moment.js?" [level=3] [ref=e4342]:
              - link [aria-hidden] [ref=e4343] [cursor=pointer]:
                - /url: "#faq-custom-date-library"
              - text: How to use DatePicker with customize date library like Moment.js?
