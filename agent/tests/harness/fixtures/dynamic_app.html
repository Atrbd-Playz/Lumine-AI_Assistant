<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic JavaScript Application Certification</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; max-width: 860px; margin: 0 auto; }
    section { border: 1px solid #cbd5e0; border-radius: 6px; padding: 12px 16px; margin: 14px 0; }
    input { padding: 6px; width: 320px; }
    button { padding: 6px 12px; margin: 4px 4px 4px 0; cursor: pointer; }
    [disabled] { opacity: .5; cursor: not-allowed; }
    ul { margin: 8px 0; padding-left: 22px; }
    .toast { position: fixed; right: 18px; bottom: 18px; background: #1a202c; color: white; padding: 10px 14px; border-radius: 6px; }
    .spinner { color: #2b6cb0; font-family: monospace; }
    #clock { font-family: monospace; }
  </style>
</head>
<body>
  <h1>Dynamic JavaScript Certification</h1>

  <section id="async-search">
    <h2>Debounced Async Search</h2>
    <label for="search-input">Search Products</label>
    <input id="search-input" placeholder="Type at least two characters">
    <span id="search-state" class="spinner">idle</span>
    <ul id="search-results"></ul>
  </section>

  <section id="controlled">
    <h2>Controlled Input Re-render</h2>
    <label for="controlled-input">Display Name</label>
    <input id="controlled-input" value="">
    <button id="btn-commit">Commit Name</button>
    <output id="committed-name">(not committed)</output>
  </section>

  <section id="conditional">
    <h2>Conditional Enablement</h2>
    <label><input type="checkbox" id="terms-check"> I accept the synthetic terms</label>
    <button id="btn-checkout" disabled>Place Order</button>
    <output id="order-state">waiting</output>
  </section>

  <section id="optimistic">
    <h2>Optimistic Update</h2>
    <button id="btn-like">Like</button>
    <output id="like-count">0</output>
    <output id="like-state">idle</output>
  </section>

  <section id="clock-section">
    <h2>Polling Update</h2>
    <output id="clock">tick-0</output>
  </section>

  <div id="toast-root"></div>

  <script>
    const state = (id, text) => { document.getElementById(id).textContent = text; };

    // 1. Debounced search: results appear after a deliberate delay, and an
    //    earlier response must never overwrite a later query.
    const searchInput = document.getElementById('search-input');
    const results = document.getElementById('search-results');
    let timer = null;
    let requestSeq = 0;
    searchInput.addEventListener('input', () => {
      window.clearTimeout(timer);
      const query = searchInput.value.trim();
      results.innerHTML = '';
      if (query.length < 2) { state('search-state', 'idle'); return; }
      state('search-state', 'waiting');
      timer = window.setTimeout(async () => {
        const mine = ++requestSeq;
        state('search-state', 'loading');
        const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();
        if (mine !== requestSeq) return;
        results.innerHTML = '';
        for (const row of data.results) {
          const li = document.createElement('li');
          const button = document.createElement('button');
          button.textContent = row.title;
          button.setAttribute('data-product', row.sku);
          button.addEventListener('click', () => state('search-state', `selected:${row.sku}`));
          li.appendChild(button);
          results.appendChild(li);
        }
        state('search-state', `results:${data.results.length}`);
      }, 250);
    });

    // 2. A controlled input whose DOM node is replaced by a re-render, exactly
    //    as React does. Typed text lives in JS state, not in the element.
    let name = '';
    const controlled = document.getElementById('controlled-input');
    function renderControlled() {
      const replacement = controlled.cloneNode();
      replacement.value = name;
      replacement.id = 'controlled-input';
      replacement.addEventListener('input', (event) => { name = event.target.value; });
      controlled.replaceWith(replacement);
      document.getElementById('committed-name').textContent = name || '(empty)';
    }
    controlled.addEventListener('input', (event) => { name = event.target.value; });
    document.getElementById('btn-commit').addEventListener('click', () => {
      renderControlled();
      state('order-state', 'renamed');
    });

    // 3. Enablement is derived, not toggled: the button's own disabled property
    //    changes when the checkbox does.
    const terms = document.getElementById('terms-check');
    const checkout = document.getElementById('btn-checkout');
    terms.addEventListener('change', () => { checkout.disabled = !terms.checked; });
    checkout.addEventListener('click', () => state('order-state', 'ordered'));

    // 4. Optimistic update: the count moves first, then a slow request decides
    //    whether it stays. A read during the window sees the optimistic value.
    let likes = 0;
    document.getElementById('btn-like').addEventListener('click', async () => {
      likes += 1;
      state('like-count', String(likes));
      state('like-state', 'pending');
      try {
        await fetch('/api/delay?ms=400');
        state('like-state', 'confirmed');
      } catch (error) {
        likes -= 1;
        state('like-count', String(likes));
        state('like-state', 'rolled_back');
      }
    });

    // 5. A polling counter, so a repeated read can observe that the page moved
    //    without the agent doing anything.
    let tick = 0;
    window.setInterval(() => { tick += 1; state('clock', `tick-${tick}`); }, 350);

    // 6. A toast that removes itself, which is a control that exists only for a
    //    moment -- the case a stale reference must not click.
    window.showFixtureToast = () => {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.id = 'transient-toast';
      toast.textContent = 'Transient notification';
      document.getElementById('toast-root').appendChild(toast);
      window.setTimeout(() => toast.remove(), 700);
    };
  </script>
</body>
</html>
